name: Deploy Server (Docker & Liara)

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'core/**'
      - 'build-logic/**'
      - 'Dockerfile'
      - 'liara.json'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Clean host-specific properties for CI
        run: sed -i '/org.gradle.java.home/d' gradle.properties 2>/dev/null || true

      - name: Build Server Distribution
        run: |
          ./gradlew :server:installDist --no-daemon
          rm -rf server-dist
          cp -R server/build/install/server server-dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to Liara (if LIARA_API_TOKEN is configured)
        if: "${{ env.LIARA_TOKEN != '' }}"
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          sed -i '/server-dist/d' .gitignore
          npm install -g @liara/cli
          liara deploy --app expenseshare-server --port 8082 --platform docker --api-token "$LIARA_TOKEN" --detach
