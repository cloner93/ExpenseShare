name: Deploy Telegram Mini App to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'composeApp/**'
      - 'core/**'
      - 'build-logic/**'
      - '.github/workflows/deploy-mini-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Clean host-specific properties for CI
        run: sed -i '/org.gradle.java.home/d' gradle.properties 2>/dev/null || true

      - name: Build Web / Wasm Distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'composeApp/build/dist/wasmJs/productionExecutable/'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
